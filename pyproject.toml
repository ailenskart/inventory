[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lenskart-retail-intelligence"
version = "0.1.0"
description = "Lenskart Retail Intelligence Platform - Demand forecasting, assortment optimization, replenishment, and vendor collaboration"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Lenskart Engineering" }]

dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.9",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "httpx>=0.27.0",
    "pandas>=2.2.0",
    "polars>=0.20.0",
    "duckdb>=0.10.0",
    "statsforecast>=1.7.0",
    "hierarchicalforecast>=0.4.0",
    "ortools>=9.9",
    "mlflow>=2.11.0",
    "feast>=0.37.0",
    "dagster>=1.6.0",
    "dagster-postgres>=0.22.0",
    "dbt-core>=1.7.0",
    "dbt-postgres>=1.7.0",
    "dbt-duckdb>=1.7.0",
    "structlog>=24.1.0",
    "tenacity>=8.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
    "ipython>=8.22.0",
    "faker>=24.0.0",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "ml", "services", "schemas", "orchestration"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "smoke: Smoke tests",
]
