###############################################################################
# Lenskart Retail Intelligence — Production Docker Compose
#
# Services:
#   1. api         — FastAPI app (port 8000 internal, exposed via nginx)
#   2. dagster     — Dagster webserver + daemon for pipeline orchestration
#   3. postgres    — Metadata DB (MLflow, Dagster, Feast)
#   4. mlflow      — Experiment tracking UI
#   5. minio       — S3-compatible artifact storage
#   6. nginx       — Reverse proxy + SSL termination
#   7. bootstrap   — One-shot: generates data, runs dbt, seeds DuckDB
#
# Usage:
#   cp .env.example .env          # fill in your values
#   docker compose -f docker-compose.prod.yml up -d
#   docker compose -f docker-compose.prod.yml logs -f api
###############################################################################

services:

  # ── 1. FastAPI Application ────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lenskart-api
    restart: unless-stopped
    env_file: .env
    environment:
      LENSKART_DB_PATH: /app/data/dev.duckdb
      MLFLOW_TRACKING_URI: http://mlflow:5000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
    volumes:
      - app_data:/app/data
      - dbt_target:/app/transform/dbt/target
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"

  # ── 2. Dagster Orchestration ──────────────────────────────────────────────
  dagster-webserver:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lenskart-dagster-web
    restart: unless-stopped
    env_file: .env
    environment:
      DAGSTER_HOME: /app/dagster_home
      LENSKART_DB_PATH: /app/data/dev.duckdb
      DAGSTER_PG_HOST: postgres
      DAGSTER_PG_DB: dagster
      DAGSTER_PG_USER: ${POSTGRES_USER:-lenskart}
      DAGSTER_PG_PASSWORD: ${POSTGRES_PASSWORD:-lenskart_dev}
    volumes:
      - app_data:/app/data
      - dagster_home:/app/dagster_home
      - dbt_target:/app/transform/dbt/target
      - ./infra/dagster/dagster.yaml:/app/dagster_home/dagster.yaml:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully
    command: >
      dagster-webserver
        -m orchestration.dagster.lenskart_dagster.definitions
        -h 0.0.0.0
        -p 3000

  dagster-daemon:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lenskart-dagster-daemon
    restart: unless-stopped
    env_file: .env
    environment:
      DAGSTER_HOME: /app/dagster_home
      LENSKART_DB_PATH: /app/data/dev.duckdb
      DAGSTER_PG_HOST: postgres
      DAGSTER_PG_DB: dagster
      DAGSTER_PG_USER: ${POSTGRES_USER:-lenskart}
      DAGSTER_PG_PASSWORD: ${POSTGRES_PASSWORD:-lenskart_dev}
    volumes:
      - app_data:/app/data
      - dagster_home:/app/dagster_home
      - dbt_target:/app/transform/dbt/target
      - ./infra/dagster/dagster.yaml:/app/dagster_home/dagster.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully
    command: >
      dagster-daemon run
        -m orchestration.dagster.lenskart_dagster.definitions

  # ── 3. PostgreSQL (metadata) ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: lenskart-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lenskart}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lenskart_dev}
      POSTGRES_DB: lenskart_retail
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lenskart}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  # ── 4. MLflow Tracking ────────────────────────────────────────────────────
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.11.1
    container_name: lenskart-mlflow
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql://${POSTGRES_USER:-lenskart}:${POSTGRES_PASSWORD:-lenskart_dev}@postgres:5432/mlflow
      MLFLOW_DEFAULT_ARTIFACT_ROOT: s3://mlflow-artifacts/
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
    ports:
      - "127.0.0.1:5001:5000"
    command: >
      mlflow server
        --host 0.0.0.0
        --port 5000
        --backend-store-uri postgresql://${POSTGRES_USER:-lenskart}:${POSTGRES_PASSWORD:-lenskart_dev}@postgres:5432/mlflow
        --default-artifact-root s3://mlflow-artifacts/

  # ── 5. MinIO (S3-compatible object storage) ───────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: lenskart-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

  minio-init:
    image: minio/mc:latest
    container_name: lenskart-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin};
      mc mb local/mlflow-artifacts --ignore-existing;
      mc mb local/feast-registry --ignore-existing;
      mc mb local/lenskart-exports --ignore-existing;
      exit 0;
      "

  # ── 6. Nginx Reverse Proxy ───────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: lenskart-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── 7. Certbot (SSL certificates) ────────────────────────────────────────
  certbot:
    image: certbot/certbot:latest
    container_name: lenskart-certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    # Run once then exit; renew via cron or docker compose run certbot renew
    entrypoint: >
      /bin/sh -c "
      echo 'Certbot ready. Run: docker compose run certbot certonly --webroot -w /var/www/certbot -d YOUR_DOMAIN';
      exit 0;
      "

  # ── 8. Bootstrap (one-shot data init) ────────────────────────────────────
  bootstrap:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lenskart-bootstrap
    env_file: .env
    environment:
      LENSKART_DB_PATH: /app/data/dev.duckdb
    volumes:
      - app_data:/app/data
      - dbt_target:/app/transform/dbt/target
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      /bin/sh -c "
        echo '=== Generating synthetic data ===' &&
        python data/synthetic/generate.py &&
        echo '=== Loading dbt seeds ===' &&
        python data/load_seeds.py &&
        echo '=== Running dbt seed ===' &&
        cd transform/dbt && dbt seed --profiles-dir . --full-refresh &&
        echo '=== Running dbt models ===' &&
        dbt run --profiles-dir . &&
        echo '=== Running dbt tests ===' &&
        dbt test --profiles-dir . &&
        cd /app &&
        echo '=== Validating data ===' &&
        python data/validate.py &&
        echo '=== Bootstrap complete ==='
      "
    restart: "no"

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local
  app_data:
    driver: local
  dagster_home:
    driver: local
  dbt_target:
    driver: local
  certbot_www:
    driver: local
  certbot_certs:
    driver: local
