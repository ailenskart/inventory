version: 2

sources:
  - name: raw
    schema: raw
    tables:
      - name: stores
      - name: skus
      - name: vendors
      - name: daily_sales
      - name: daily_inventory
      - name: store_trials
      - name: store_traffic

models:
  - name: stg_stores
    description: "Cleaned store master data"
    columns:
      - name: store_id
        tests:
          - not_null
          - unique

  - name: stg_skus
    description: "Cleaned SKU master data"
    columns:
      - name: sku_id
        tests:
          - not_null
          - unique

  - name: stg_daily_sales
    description: "Cleaned daily sales transactions"
    columns:
      - name: store_id
        tests:
          - not_null
      - name: sku_id
        tests:
          - not_null

  - name: stg_daily_inventory
    description: "Daily inventory snapshots"

  - name: stg_store_trials
    description: "Store try-on events (display demand signal)"
